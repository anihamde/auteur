<!-- @dsCard group="Colors" viewport="700x150" name="Light theme surfaces" subtitle="data-theme=&quot;light&quot; re-points the semantic aliases onto the paper ramp" -->
<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px 20px;background:var(--surface-app)}.r{display:flex;gap:10px;align-items:stretch}.s{flex:1;display:flex;flex-direction:column;gap:6px}.sw{height:52px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}.n{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted);line-height:1.3}.t{font:var(--type-caption);color:var(--text-faint)}</style>
</head><body>
<div class="r">
<div class="s"><div class="sw" style="background:var(--surface-app)"></div><span class="n">--surface-app</span></div>
<div class="s"><div class="sw" style="background:var(--surface-panel)"></div><span class="n">--surface-panel</span></div>
<div class="s"><div class="sw" style="background:var(--surface-card);box-shadow:var(--shadow-card)"></div><span class="n">--surface-card</span></div>
<div class="s"><div class="sw" style="background:var(--surface-hover)"></div><span class="n">--surface-hover</span></div>
<div class="s"><div class="sw" style="background:var(--accent)"></div><span class="n">--accent</span></div>
<div class="s"><div class="sw" style="background:var(--measured-tint);border-color:var(--measured)"></div><span class="n">--measured-tint</span></div>
<div class="s"><div class="sw" style="background:var(--edited-tint);border-color:var(--edited)"></div><span class="n">--edited-tint</span></div>
</div>
<p class="t" style="margin-top:10px">In light theme the ink/paper distinction collapses by design: the whole surface is paper, and prose panels separate by shadow and hairline instead of by ground.</p>
</body></html>
