<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.ramp{display:grid;gap:0}.ramp{grid-auto-flow:column}.sw{height:74px;display:flex;align-items:flex-end;padding:6px}.sw span{font:var(--type-data);font-size:10px}.cap{display:flex;gap:0;margin-top:8px}.cap span{font:var(--type-caption);color:var(--text-faint);flex:1;text-align:center}</style></head><body><div class="ramp" style="grid-template-columns:repeat(13,1fr)"><div class="sw" style="background:var(--ink-1000);color:var(--ink-300)"><span>ink-1000</span></div><div class="sw" style="background:var(--ink-950);color:var(--ink-300)"><span>ink-950</span></div><div class="sw" style="background:var(--ink-900);color:var(--ink-300)"><span>ink-900</span></div><div class="sw" style="background:var(--ink-850);color:var(--ink-300)"><span>ink-850</span></div><div class="sw" style="background:var(--ink-800);color:var(--ink-200)"><span>ink-800</span></div><div class="sw" style="background:var(--ink-700);color:var(--ink-100)"><span>ink-700</span></div><div class="sw" style="background:var(--ink-600);color:var(--ink-050)"><span>ink-600</span></div><div class="sw" style="background:var(--ink-500);color:var(--ink-050)"><span>ink-500</span></div><div class="sw" style="background:var(--ink-400);color:var(--ink-1000)"><span>ink-400</span></div><div class="sw" style="background:var(--ink-300);color:var(--ink-1000)"><span>ink-300</span></div><div class="sw" style="background:var(--ink-200);color:var(--ink-1000)"><span>ink-200</span></div><div class="sw" style="background:var(--ink-100);color:var(--ink-1000)"><span>ink-100</span></div><div class="sw" style="background:var(--ink-050);color:var(--ink-1000)"><span>ink-050</span></div></div></body></html>
