<!-- @dsCard group="Colors" viewport="700x150" name="Semantic hues" subtitle="Laurel = measured/pass · Amber = edited/drift · Oxblood = fail" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stack{display:flex}.b{height:46px;flex:1;display:flex;align-items:center;justify-content:center;font:var(--type-data);font-size:10px}.n{font:var(--type-caption);color:var(--text-muted);margin-top:6px;display:block}</style></head><body><div class="grid">
   <div><div class="stack"><div class="b" style="background:var(--laurel-tint);color:var(--laurel-400)">tint</div><div class="b" style="background:var(--laurel-600);color:var(--paper-050)">600</div><div class="b" style="background:var(--laurel-500);color:var(--ink-1000)">500</div><div class="b" style="background:var(--laurel-400);color:var(--ink-1000)">400</div></div><span class="n">laurel — measured, pass</span></div>
   <div><div class="stack"><div class="b" style="background:var(--amber-tint);color:var(--amber-400)">tint</div><div class="b" style="background:var(--amber-600);color:var(--ink-1000)">600</div><div class="b" style="background:var(--amber-500);color:var(--ink-1000)">500</div><div class="b" style="background:var(--amber-400);color:var(--ink-1000)">400</div></div><span class="n">amber — edited, drift, strong tier</span></div>
   <div><div class="stack"><div class="b" style="background:var(--oxblood-tint);color:var(--oxblood-400)">tint</div><div class="b" style="background:var(--oxblood-600);color:var(--paper-050)">600</div><div class="b" style="background:var(--oxblood-500);color:var(--paper-050)">500</div><div class="b" style="background:var(--oxblood-400);color:var(--ink-1000)">400</div></div><span class="n">oxblood — failure, destructive</span></div>
   </div></body></html>
