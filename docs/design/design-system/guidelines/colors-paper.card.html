<!-- @dsCard group="Colors" viewport="700x140" name="Paper ramp" subtitle="The artifact ground — warm cream, for prose and verbatim quotation only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.ramp{display:grid;gap:0}.ramp{grid-auto-flow:column}.sw{height:74px;display:flex;align-items:flex-end;padding:6px}.sw span{font:var(--type-data);font-size:10px}.cap{display:flex;gap:0;margin-top:8px}.cap span{font:var(--type-caption);color:var(--text-faint);flex:1;text-align:center}</style></head><body><div class="ramp" style="grid-template-columns:repeat(6,1fr)"><div class="sw" style="background:var(--paper-500);color:var(--ink-1000)"><span>paper-500</span></div><div class="sw" style="background:var(--paper-400);color:var(--ink-1000)"><span>paper-400</span></div><div class="sw" style="background:var(--paper-300);color:var(--ink-1000)"><span>paper-300</span></div><div class="sw" style="background:var(--paper-200);color:var(--ink-1000)"><span>paper-200</span></div><div class="sw" style="background:var(--paper-100);color:var(--ink-1000)"><span>paper-100</span></div><div class="sw" style="background:var(--paper-050);color:var(--ink-1000)"><span>paper-050</span></div></div></body></html>
