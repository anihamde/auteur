<!-- @dsCard group="Brand" viewport="700x150" name="Wordmark" subtitle="The mark IS the A — script capital, then uteur in EB Garamond. Never doubled" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;padding:18px 20px;display:block}
.r{display:flex;align-items:center;gap:36px}
.lock{display:inline-flex;align-items:baseline;color:var(--text-strong);line-height:1}
.lock .a{font-family:var(--font-script);line-height:0.8}
.lock .w{font-family:var(--font-serif);font-weight:400;letter-spacing:var(--tracking-snug)}
.sub{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint);display:block;margin-top:6px}
.n{font:var(--type-caption);color:var(--text-faint);max-width:230px;line-height:1.45}
</style></head><body><div class="r">
<div><span class="lock"><span class="a" style="font-size:76px">A</span><span class="w" style="font-size:42px;margin-left:-2px">uteur</span></span><span class="sub">style from evidence</span></div>
<div style="background:var(--surface-paper);padding:12px 18px;border-radius:var(--radius-paper);box-shadow:var(--shadow-paper)"><span class="lock" style="color:var(--text-paper)"><span class="a" style="font-size:54px">A</span><span class="w" style="font-size:30px;margin-left:-1px">uteur</span></span></div>
<span class="n">The script A carries the word &mdash; there is no second, roman <em>a</em>. Baselines align; the A sets at 1.8&times; the roman size, optically kerned tight. Everything after it stays lowercase.</span>
</div></body></html>
