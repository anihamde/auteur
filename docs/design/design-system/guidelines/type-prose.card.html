<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.p{background:var(--surface-paper);color:var(--text-paper);padding:20px 24px;border-radius:var(--radius-paper);box-shadow:var(--shadow-paper);max-width:var(--measure-prose);font-family:var(--font-serif);font-size:var(--text-md);line-height:var(--leading-prose)}.p p+p{text-indent:1.4em;margin-top:1em}</style></head><body><div class="p"><p>The edition before me, privately printed at Plymouth in 1924, runs to three hundred and forty pages, of which the first two hundred and eighty-eight are indisputably in the keeper's hand.</p><p>I say indisputably; I mean that no one has disputed it.</p></div></body></html>
