<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & text on ink" subtitle="Four ink surfaces, four text weights, three line weights" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.wrap{display:flex;gap:14px}.s{flex:1;border-radius:var(--radius-card);padding:12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--border-hairline)}.s b{font:var(--type-data);font-size:10px;color:var(--text-faint);font-weight:400}.txt{display:flex;flex-direction:column;gap:5px;flex:1.2}.txt span{font:var(--type-body);font-size:13px}</style></head><body><div class="wrap">
   <div class="s" style="background:var(--surface-app)"><b>--surface-app</b></div>
   <div class="s" style="background:var(--surface-panel)"><b>--surface-panel</b></div>
   <div class="s" style="background:var(--surface-card)"><b>--surface-card</b></div>
   <div class="s" style="background:var(--surface-raised)"><b>--surface-raised</b></div>
   <div class="txt">
     <span style="color:var(--text-strong)">--text-strong</span>
     <span style="color:var(--text-body)">--text-body</span>
     <span style="color:var(--text-muted)">--text-muted</span>
     <span style="color:var(--text-faint)">--text-faint</span>
     <span style="color:var(--text-accent)">--text-accent</span>
   </div></div></body></html>
