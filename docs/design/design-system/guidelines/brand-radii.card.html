<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.r{display:flex;gap:16px;align-items:flex-end}.b{width:88px;height:60px;background:var(--surface-raised);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}.n{font:var(--type-data);font-size:10px;color:var(--text-faint)}</style></head><body><div class="r"><div class="b" style="border-radius:var(--radius-paper)"><span class="n">2px</span></div><div class="b" style="border-radius:var(--radius-xs)"><span class="n">3px</span></div><div class="b" style="border-radius:var(--radius-sm)"><span class="n">5px</span></div><div class="b" style="border-radius:var(--radius-md)"><span class="n">8px</span></div><div class="b" style="border-radius:var(--radius-lg)"><span class="n">12px</span></div><div class="b" style="border-radius:var(--radius-xl)"><span class="n">16px</span></div><span class="n" style="max-width:150px;line-height:1.5">Nothing is a pill except status dots. No radius above 16px anywhere.</span></div></body></html>
