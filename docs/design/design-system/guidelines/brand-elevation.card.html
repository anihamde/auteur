<!-- @dsCard group="Brand" viewport="700x160" name="Elevation" subtitle="On ink, elevation is a lighter hairline. On paper, a real drop shadow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.r{display:flex;gap:16px;align-items:center}.b{flex:1;height:82px;border-radius:var(--radius-card);display:flex;align-items:flex-end;padding:8px}.n{font:var(--type-data);font-size:10px;color:var(--text-faint)}</style></head><body><div class="r">
   <div class="b" style="background:var(--surface-card);box-shadow:var(--shadow-card);border:1px solid var(--border-hairline)"><span class="n">--shadow-card</span></div>
   <div class="b" style="background:var(--surface-raised);box-shadow:var(--shadow-raised)"><span class="n">--shadow-raised</span></div>
   <div class="b" style="background:var(--surface-raised);box-shadow:var(--shadow-popover)"><span class="n">--shadow-popover</span></div>
   <div class="b" style="background:var(--surface-paper);box-shadow:var(--shadow-paper);border-radius:var(--radius-paper)"><span class="n" style="color:var(--text-paper-faint)">--shadow-paper</span></div>
   </div></body></html>
