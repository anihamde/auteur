<!-- @dsCard group="Type" viewport="700x150" name="The three-face rule" subtitle="Serif = what the author wrote. Sans = what the app says. Mono = what was measured" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.c{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.b{border-left:2px solid var(--border-subtle);padding-left:12px;display:flex;flex-direction:column;gap:6px}.n{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint)}.t{font:var(--type-caption);color:var(--text-muted);line-height:1.45}</style></head><body><div class="c">
   <div class="b" style="border-color:var(--paper-400)"><span class="n">EB Garamond</span><span style="font-family:var(--font-serif);font-size:20px;color:var(--text-strong)">Prose, quotation</span><span class="t">Story text, exemplars, titles, the wordmark. Never a button.</span></div>
   <div class="b" style="border-color:var(--prussian-500)"><span class="n">Archivo</span><span style="font-family:var(--font-sans);font-size:20px;font-weight:600;color:var(--text-strong)">Interface</span><span class="t">Labels, buttons, hints, headers. Never story text.</span></div>
   <div class="b" style="border-color:var(--laurel-500)"><span class="n">IBM Plex Mono</span><span style="font-family:var(--font-mono);font-size:19px;color:var(--text-strong)">24.6 / 1k</span><span class="t">Numbers, stage ids, schema paths, versions.</span></div>
   </div></body></html>
