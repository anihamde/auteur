<!-- @dsCard group="Brand" viewport="700x180" name="Ink and paper" subtitle="The one structural rule: the instrument is dark, the artifact is cream" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;display:block}.r{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ink{background:var(--surface-card);border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:14px}.pap{background:var(--surface-paper);color:var(--text-paper);border-radius:var(--radius-paper);box-shadow:var(--shadow-paper);padding:16px 18px}.k{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint);display:block;margin-bottom:8px}.st{display:flex;justify-content:space-between;font:var(--type-data);font-size:11px;padding:4px 0;border-bottom:1px solid var(--border-hairline)}</style></head><body><div class="r">
   <div class="ink"><span class="k">instrument · ink · mono</span>
     <div class="st"><span style="color:var(--text-muted)">sentenceLength.median</span><span style="color:var(--text-strong)">21.0</span></div>
     <div class="st"><span style="color:var(--text-muted)">semicolon /1k</span><span style="color:var(--text-strong)">6.4</span></div>
     <div class="st" style="border:none"><span style="color:var(--text-muted)">dialogueRatio</span><span style="color:var(--text-strong)">0.08</span></div>
   </div>
   <div class="pap"><span class="k" style="color:var(--text-paper-faint)">artifact · paper · serif</span>
     <div style="font-family:var(--font-serif);font-size:var(--text-md);line-height:var(--leading-prose)">I owe the discovery of Uqbar to the conjunction of a mirror and an encyclopedia.</div>
     <div style="font:var(--type-caption);color:var(--text-paper-muted);margin-top:8px;border-top:1px solid var(--border-paper);padding-top:6px">Tlön, Uqbar, Orbis Tertius, 1940</div>
   </div></div></body></html>
