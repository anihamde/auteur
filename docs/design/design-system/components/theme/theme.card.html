<!-- @dsCard group="Components" viewport="700x190" name="Theme" subtitle="ThemeToggle — auto resolves by local clock; click to flip this card" -->
<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--surface-app)}.row{display:flex;align-items:center;gap:28px;flex-wrap:wrap}.lab{font:var(--type-eyebrow);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-faint);display:block;margin-bottom:8px}.n{font:var(--type-caption);color:var(--text-faint);max-width:250px;line-height:1.45}.chip{display:flex;flex-direction:column;gap:6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { ThemeToggle, Badge } = window.AuteurDesignSystem_11e1bd;
function Demo() {
  const [mode, setMode] = React.useState('dark');
  const flip = (m) => { setMode(m); document.documentElement.dataset.theme = m === 'auto' ? (new Date().getHours() >= 6 && new Date().getHours() < 18 ? 'light' : 'dark') : m; };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <div className="row">
        <div className="chip"><span className="lab">Default (sm)</span><ThemeToggle size="sm" mode={mode} onChange={flip} /></div>
        <div className="chip"><span className="lab">md</span><ThemeToggle mode={mode} onChange={flip} /></div>
        <div className="chip"><span className="lab">With labels</span><ThemeToggle showLabels mode={mode} onChange={flip} /></div>
        <span className="n">Auto is the default and resolves by local clock: light 06:00&ndash;18:00, dark otherwise.</span>
      </div>
      <div className="row" style={{ gap: 10 }}>
        <Badge variant="measured">resolved: {mode === 'auto' ? (new Date().getHours() >= 6 && new Date().getHours() < 18 ? 'light' : 'dark') : mode}</Badge>
        <Badge variant="cheap">data-theme-mode: {mode}</Badge>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
